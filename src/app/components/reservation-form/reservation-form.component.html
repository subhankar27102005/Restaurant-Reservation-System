
<div class="form-container">
  <h2>Add Reservation</h2>

  <form (ngSubmit)="addReservation()" #reservationForm="ngForm">

    <div class="form-row">
      <div class="form-group">
        <label>Customer Name</label>
        <input
          type="text"
          name="customerName"
          [(ngModel)]="reservation.customerName"
          placeholder="Enter customer name"
          required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="tel"
          name="phone"
          [(ngModel)]="reservation.phone"
          placeholder="Enter phone number"
          required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input
          type="date"
          name="date"
          [(ngModel)]="reservation.date"
          required>
      </div>

      <div class="form-group">
        <label>Time</label>
        <input
          type="time"
          name="time"
          [(ngModel)]="reservation.time"
          required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Guests</label>
        <input
          type="number"
          name="guests"
          [(ngModel)]="reservation.guests"
          min="1"
          max="20"
          required>
      </div>

      <div class="form-group">
        <label>Table Number</label>
        <select
          name="tableNumber"
          [(ngModel)]="reservation.tableNumber"
          required>
          <option [ngValue]="1">Table 1</option>
          <option [ngValue]="2">Table 2</option>
          <option [ngValue]="3">Table 3</option>
          <option [ngValue]="4">Table 4</option>
          <option [ngValue]="5">Table 5</option>
          <option [ngValue]="6">Table 6</option>
          <option [ngValue]="7">Table 7</option>
          <option [ngValue]="8">Table 8</option>
          <option [ngValue]="9">Table 9</option>
          <option [ngValue]="10">Table 10</option>
        </select>
      </div>
    </div>

    <div class="buttons">
      <button
        type="button"
        class="cancel"
        (click)="cancel()">
        Cancel
      </button>

      <button type="submit" class="save">
        + Add Reservation
      </button>
    </div>

  </form>
</div>
